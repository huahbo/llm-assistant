[package]
name = "llm-wiki-tauri"
version = "0.2.7"
edition = "2021"
build = "build.rs"

[dependencies]
async-trait = "0.1"
flate2 = "1"
lopdf = "0.34"
pdf-extract = "0.10"
regex = "1.12.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
scraper = "0.20"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
tiny_http = "0.12"
chrono = "0.4"
zip = "0.6"
pulldown-cmark = "0.11"
# 显式 default-features=false 并固定 api-20 — 我们用的 onnxruntime.dll 1.20.1 只支持 API≤20。
# 若启用 default features，ort 会要求 api-24（GetApi(24) 返回 null → ort 内部死锁）。
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "api-20", "ndarray"] }
tokenizers = "0.20"
ndarray = "0.16"
headless_chrome = "1.0"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
